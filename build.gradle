plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.awesome'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Spring Boot 4 splits auto-configuration per technology.
    // Without this module, flyway-core sits on the classpath but migrations
    // never run on startup — no error, no warning (docs/06 §5).
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    // Lambda inference call (D-23). Spring Boot does not manage the AWS SDK version.
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:lambda'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:apache-client'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x — 1.x의 junit-jupiter/postgresql에서 모듈명 변경
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    // 벤치마크는 기본 테스트에서 뺀다 — 수 분이 걸리고 통과·실패를 가리지 않는다
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

// 편성 시간 측정 전용. ./gradlew benchmark
tasks.register('benchmark', Test) {
    description = '카토나이제이션 확장성 벤치마크 (@Tag("benchmark"))'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    // 측정값은 매번 다르므로 캐시된 결과를 재사용하지 않는다
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}
