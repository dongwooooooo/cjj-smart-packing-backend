server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

packing:
  # 명세 §4-6. margin-cm은 D-11 확정값, filler-thickness-cm은 리허설 때 조정할 임의값
  margin-cm: 3.0
  filler-thickness-cm: 1.0

demo:
  # API 앞단 열쇠 (D-26). 비우면 검사하지 않는다 — 로컬·테스트는 그대로 돈다.
  # 시연 서버는 인터넷에 열려 있고 백엔드에 로그인이 없어, 화면(Vercel)만 이 값을 쥔다.
  api-key: ${DEMO_API_KEY:}
  # 시연 데이터 위치. 상대 경로라 로컬 실행과 컨테이너가 같은 값을 쓴다
  data-dir: ./demo/data
  box-stock-qty: 100
  # 리셋 끝에 미리 투입할 주문 묶음 수. 시연을 시작하면 라인마다 포장할 배송단위가 이미
  # 놓여 있어야 한다. 남는 묶음은 시연 도중 Load 로 넣어 주문이 들어오는 장면을 만든다.
  prereleased-batches: ${DEMO_PRERELEASED_BATCHES:15}
  # 리셋 끝에 추론을 한 번 깨운다. Lambda 첫 호출은 콜드 스타트라 10초까지 걸리는데
  # 촬영 계약의 타임아웃이 8초라, 시연 첫 장면이 그대로 실패로 보인다.
  warmup-inference: ${DEMO_WARMUP_INFERENCE:true}

storage:
  # 이미지 버킷. 비우면 로컬 디렉토리에 두고 정적으로 서빙한다 (개발·테스트, D-25)
  bucket: ${STORAGE_BUCKET:}
  region: ${STORAGE_AWS_REGION:ap-northeast-2}
  # 임시 조회 주소 유효시간. 화면을 열어 둔 채 만료되지 않을 만큼 길고, 새어 나가도 오래 못 쓸 만큼 짧게
  presign-ttl: ${STORAGE_PRESIGN_TTL:30m}
  local-base-path: ${STORAGE_LOCAL_PATH:./demo/data}
  local-url-prefix: /files/m/

inference:
  # Lambda 함수 이름(별칭 포함, 예: logistics-dimension-api:live). 비우면 mock (D-04, D-24)
  lambda-function: ${INFERENCE_LAMBDA_FUNCTION:}
  # 함수가 검사하는 X-API-Key. IAM 호출 권한과 별개로 함수 쪽에서 요구한다
  api-key: ${INFERENCE_API_KEY:}
  region: ${INFERENCE_AWS_REGION:ap-northeast-2}
  timeout-seconds: ${INFERENCE_TIMEOUT_SECONDS:8}

  # 신뢰도 게이트 (02 §1-3). 임계값은 아직 명세에 확정된 숫자가 없어 잠정값이다 —
  # 실제 모델 성능을 보고 조정하며, 코드 수정 없이 이 값만 바꾸면 된다.
  gate:
    min-confidence: 0.85
    # 가장 긴 변 / 가장 짧은 변. 이보다 납작하면 추론이 축을 잘못 잡은 것으로 본다.
    # 시연 상품 중 가장 납작한 오뜨 치즈가 7.7 이라 8.0 은 여유가 0.3 뿐이다 — 추론이
    # 조금만 달라져도 승인이 막히므로 10.0 으로 둔다.
    max-aspect-ratio: 10.0
    # 촬영함에 들어갈 수 있는 물리적 상한
    max-dimension-cm: 100.0

  # INFERENCE_API_URL 미설정 시 쓰는 mock (D-04). 시연·프론트 개발용.
  mock:
    base-width-cm: 12.0
    base-length-cm: 9.0
    base-height-cm: 20.0
    # 호출마다 기준 치수를 ±이 비율만큼 흔든다. 재촬영이 매번 같은 값이면 의미가 없다.
    jitter-ratio: 0.25
    # confidence 를 이 범위에서 뽑는다. 하한이 gate.min-confidence 보다 낮아야
    # 게이트 미통과 화면(승인 버튼 비활성)도 가끔 시연된다.
    min-confidence: 0.83
    max-confidence: 0.99
    # 0 이면 추론 실패(MEASURE_FAILED) 를 만들지 않는다. 수동 입력 fallback 화면을
    # 시연하려면 0.2 처럼 올려서 쓴다.
    failure-rate: 0
