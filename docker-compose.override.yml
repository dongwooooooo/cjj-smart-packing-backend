# 로컬 개발용 DB. compose 가 docker-compose.yml 과 자동으로 합친다.
# RDS 를 쓰는 환경은 .env 의 COMPOSE_FILE=docker-compose.yml 로 이 파일을 제외한다.
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 이미지부터 데이터 경로가 바뀌어 /var/lib/postgresql 에 마운트해야 한다
      # (data 하위에 마운트하면 기동 실패 후 재시작 루프)
      - pgdata:/var/lib/postgresql
    healthcheck:
      # 백엔드가 Flyway 를 돌리려면 DB 가 접속을 받을 준비가 되어야 한다
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      # 컨테이너 간에는 서비스 이름이 곧 호스트명이다 (localhost 아님)
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
