# backend 단독 기동용 compose (db + backend).
# 프론트 포함 전체 스택 구성은 docs/06-docker-setup.md 참고.
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 이미지부터 데이터 경로가 바뀌어 /var/lib/postgresql 에 마운트해야 한다
      # (data 하위에 마운트하면 기동 실패 후 재시작 루프)
      - pgdata:/var/lib/postgresql
    healthcheck:
      # 백엔드가 Flyway 를 돌리려면 DB 가 접속을 받을 준비가 되어야 한다
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    environment:
      # 컨테이너 간에는 서비스 이름이 곧 호스트명이다 (localhost 아님)
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      SERVER_PORT: 8000
      INFERENCE_LAMBDA_FUNCTION: ${INFERENCE_LAMBDA_FUNCTION:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-8}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
