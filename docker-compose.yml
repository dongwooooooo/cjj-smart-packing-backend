# backend 기동용 compose.
#
# 이 파일은 backend 만 정의한다. 로컬 개발용 db 는 docker-compose.override.yml 에 있고,
# compose 가 그 파일을 자동으로 합쳐 읽으므로 로컬에서는 지금까지처럼 `docker compose up` 이면 된다.
# EC2 처럼 RDS 를 쓰는 환경은 .env 에 `COMPOSE_FILE=docker-compose.yml` 을 두어 override 를 끄고
# POSTGRES_HOST 에 RDS 엔드포인트를 넣는다 (docs/06 §RDS).
# 프론트 포함 전체 스택 구성은 docs/06-docker-setup.md 참고.
#
# 이미지는 CI 가 구워 ECR 에 올린 것을 쓴다 (build-push 워크플로). 인스턴스에서 빌드하지
# 않는 이유는 두 가지다 — 빌드가 몇 분씩 서버를 붙잡고, 돌아갈 이전 아티팩트가 남지 않는다.
# 로컬 개발은 override 가 build 로 덮어쓰므로 지금까지처럼 `docker compose up --build` 면 된다.
services:
  backend:
    image: ${BACKEND_IMAGE:-300390308149.dkr.ecr.ap-northeast-2.amazonaws.com/cj-ai-backend:latest}
    restart: unless-stopped
    environment:
      # 로컬은 override 의 db 서비스 이름, RDS 는 엔드포인트
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      SERVER_PORT: 8000
      INFERENCE_LAMBDA_FUNCTION: ${INFERENCE_LAMBDA_FUNCTION:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-8}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
    ports:
      - "8000:8000"
